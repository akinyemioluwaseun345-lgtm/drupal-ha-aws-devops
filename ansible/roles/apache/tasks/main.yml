---
- name: Install Apache HTTP Server
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Install Apache security and proxy-header settings
  ansible.builtin.template:
    src: 00-security.conf.j2
    dest: /etc/httpd/conf.d/00-security.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload httpd

- name: Install the PHP-FPM handler configuration
  ansible.builtin.template:
    src: 10-php-fpm-handler.conf.j2
    dest: /etc/httpd/conf.d/10-php-fpm-handler.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload httpd

- name: Install the Drupal virtual host
  ansible.builtin.template:
    src: 20-drupal-vhost.conf.j2
    dest: /etc/httpd/conf.d/20-drupal-vhost.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload httpd

- name: Create the systemd drop-in directory for httpd
  ansible.builtin.file:
    path: /etc/systemd/system/httpd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Restart Apache automatically if it crashes (systemd drop-in)
  ansible.builtin.copy:
    dest: /etc/systemd/system/httpd.service.d/restart.conf
    content: |
      # Managed by Ansible (role: apache)
      [Service]
      Restart=on-failure
      RestartSec=5
    owner: root
    group: root
    mode: "0644"
  register: apache_restart_dropin

- name: Reload systemd after changing the drop-in
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: apache_restart_dropin is changed

- name: Validate the Apache configuration before (re)starting
  ansible.builtin.command: httpd -t
  register: apache_config_test
  changed_when: false
  check_mode: false

- name: Ensure Apache is enabled and running
  ansible.builtin.systemd_service:
    name: httpd
    enabled: true
    state: started
