---
- name: Assert the target is Amazon Linux 2023
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Amazon'
      - ansible_facts['distribution_major_version'] == '2023'
    fail_msg: These roles are written for Amazon Linux 2023 (the AMI Terraform selects).
    quiet: true

- name: Apply security updates
  ansible.builtin.dnf:
    name: "*"
    state: latest  # noqa: package-latest
    security: true
    update_only: true
    update_cache: true
  when: common_apply_security_updates | bool
  tags: [updates]

- name: Install base packages
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present

- name: Check whether the AWS CLI is available (used to read the database secret)
  ansible.builtin.command: which aws
  register: common_aws_cli_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the AWS CLI if the image does not include it
  ansible.builtin.dnf:
    name: awscli-2
    state: present
  when: common_aws_cli_check.rc != 0

- name: Ensure the Systems Manager agent is enabled and running
  ansible.builtin.systemd_service:
    name: amazon-ssm-agent
    enabled: true
    state: started

- name: Ensure time synchronisation is enabled and running
  ansible.builtin.systemd_service:
    name: chronyd
    enabled: true
    state: started
