---
# The secret is copied by the server itself, using the server's own IAM role (it may read
# only this one secret). The value never passes through Ansible variables, the controller,
# the Ansible log or fact cache. The file is root:apache 0640.
- name: Fetch the database credentials from Secrets Manager onto this server
  ansible.builtin.shell: |
    set -euo pipefail
    umask 0027
    tmp="$(mktemp "{{ db_credentials_file }}.XXXXXX")"
    trap 'rm -f "$tmp"' EXIT
    aws secretsmanager get-secret-value \
      --secret-id "{{ db_secret_id }}" \
      --region "{{ aws_region }}" \
      --query SecretString --output text > "$tmp"
    jq -e 'has("host") and has("port") and has("dbname") and has("username") and has("password")' "$tmp" > /dev/null
    chgrp "{{ web_group }}" "$tmp"
    chmod 0640 "$tmp"
    if [ -f "{{ db_credentials_file }}" ] && cmp -s "$tmp" "{{ db_credentials_file }}"; then
      echo UNCHANGED
    else
      mv "$tmp" "{{ db_credentials_file }}"
      echo UPDATED
    fi
  args:
    executable: /bin/bash
  register: drupal_db_credentials_result
  changed_when: "'UPDATED' in drupal_db_credentials_result.stdout"
  no_log: true
