---
# Install with:  ansible-galaxy collection install -r requirements.yml
collections:
  # aws_ec2 dynamic inventory + aws_ssm connection plugin (no SSH needed)
  - name: amazon.aws
    version: ">=9.0.0"
  # ansible.posix.mount is used to mount the EFS file system
  - name: ansible.posix
    version: ">=1.5.4"
