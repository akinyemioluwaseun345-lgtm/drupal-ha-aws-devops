[defaults]
inventory           = inventory/aws_ec2.yml
roles_path          = roles
retry_files_enabled = False
nocows              = True
forks               = 5
timeout             = 60
interpreter_python  = auto_silent
# IMPORTANT: do not enable fact caching here. Facts set during a run could then be
# written to disk, and this project keeps secrets out of Ansible variables on purpose.

[inventory]
# aws_ec2 = dynamic inventory built from instance tags (no hard-coded IPs or IDs)
enable_plugins = amazon.aws.aws_ec2, ansible.builtin.yaml, ansible.builtin.ini

[privilege_escalation]
# The SSM session user (ssm-user) has passwordless sudo on Amazon Linux 2023.
become        = True
become_method = sudo
become_user   = root
